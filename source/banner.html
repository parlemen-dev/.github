<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: B; src: url(assets/bricolage.ttf); font-weight: 200 800; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; background: transparent; font-family: B, sans-serif; color: #3A1F17; }
  .banner { width: 1280px; height: 640px; padding: 28px; background: #FBF3E8; border-radius: 40px; display: grid; grid-template-columns: 1fr 1.05fr; gap: 18px; overflow: hidden; position: relative; }
  .left { display: flex; flex-direction: column; justify-content: center; padding: 0 30px; position: relative; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 34px; letter-spacing: -0.02em; }
  .brand img { width: 58px; height: 58px; }
  h1 { margin-top: 34px; font-size: 76px; line-height: 0.95; font-weight: 800; letter-spacing: -0.045em; white-space: nowrap; }
  h1 span { color: #FF5A55; }
  .tags { margin-top: 30px; display: flex; gap: 10px; flex-wrap: wrap; }
  .tag { padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 19px; color: #FFFAF3; box-shadow: inset -3px -4px 0 rgba(0,0,0,.14); }
  .right { display: grid; grid-template-rows: 1.35fr 1fr; gap: 14px; }
  .card { border-radius: 30px; overflow: hidden; position: relative; box-shadow: inset -6px -8px 0 rgba(0,0,0,.10), inset 5px 6px 0 rgba(255,255,255,.22); }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .lime { position: absolute; top: 14px; right: 14px; width: 74px; height: 74px; border-radius: 22px; background: #A6E22E; border: 6px solid #FBF3E8; transform: rotate(12deg); box-shadow: inset -5px -7px 0 rgba(0,0,0,.12); z-index: 2; }
  .dot { position: absolute; border-radius: 6px; box-shadow: inset -3px -4px 0 rgba(0,0,0,.18); }
  .spark { position: absolute; width: 34px; height: 34px; }
</style>
</head>
<body>
  <div class="banner">
    <div class="left">
      <span class="dot" style="left:30px;top:520px;width:24px;height:24px;background:#A6E22E"></span>
      <span class="dot" style="left:340px;top:60px;width:18px;height:18px;border-radius:99px;background:#2F6BFF"></span>
      <span class="dot" style="left:480px;top:520px;width:20px;height:20px;background:#8B5CF6"></span>
      <svg class="spark" style="left:470px;top:110px" viewBox="0 0 24 24"><path d="M12 0c.9 6.2 5.8 11.1 12 12-6.2.9-11.1 5.8-12 12-.9-6.2-5.8-11.1-12-12C6.2 11.1 11.1 6.2 12 0z" fill="#FFC93C"/></svg>
      <div class="brand"><img src="assets/logo.svg" />PARLEMEN.DEV</div>
      <h1>One Assembly,<br /><span>Many Works.</span></h1>
      <div class="tags">
        <span class="tag" style="background:#2F6BFF">Software House</span>
        <span class="tag" style="background:#8B5CF6">AI Film</span>
        <span class="tag" style="background:#FF5A55">Roblox Dev</span>
      </div>
    </div>
    <div class="right">
      <div style="position:relative">
        <div class="card" style="background:#FD564F;height:100%"><img src="assets/hero-character.webp" /></div>
        <div class="lime"></div>
      </div>
      <div class="row">
        <div class="card" style="background:#2964FD"><img src="assets/clapper.webp" /></div>
        <div class="card" style="background:#A1E32D"><img src="assets/code.webp" /></div>
        <div class="card" style="background:#8455F9"><img src="assets/gavel.webp" /></div>
      </div>
    </div>
  </div>
</body>
</html>
